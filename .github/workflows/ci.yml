name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      # Requis par les émulateurs Firebase (Auth, Firestore).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache des émulateurs Firebase
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      # node_modules en cache (#62) : `npm ci` coûtait ≈ 50 s sur ≈ 2 min. Clé = lockfile + Node,
      # donc toute modification des dépendances refait une installation propre.
      - name: Cache de node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}

      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run check:secrets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:outils
      - run: npm run test:emulateurs
      - run: npm run build
