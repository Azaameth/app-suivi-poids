# Mises à jour groupées, une fois par mois : une PR par écosystème, que la CI valide.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      dependances:
        update-types: [minor, patch]
    ignore:
      # Node reste en LTS (D11) : les types suivent la version de Node utilisée.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
