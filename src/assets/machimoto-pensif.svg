    <ellipse cx="45.4" cy="22.6" rx="3.1" ry="3.7"/>
  </g>
  <g fill="#b07a3e">
    <circle cx="23" cy="21.2" r="1.1"/>
    <circle cx="46.4" cy="21.2" r="1.1"/>
  </g>
  <!-- bouche songeuse -->
  <path d="M27 41.5c3 .3 6.6-.3 10-2.6" fill="none" stroke="#3b2716" stroke-width="3.2" stroke-linecap="round"/>
</svg>
