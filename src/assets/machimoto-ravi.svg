    <ellipse cx="50" cy="37" rx="3.6" ry="2.4"/>
  </g>
  <!-- grand sourire -->
  <path d="M19.5 34.5h25c0 7.4-5.5 12.5-12.5 12.5S19.5 41.9 19.5 34.5Z" fill="#3b2716"/>
  <path d="M25.4 43.6c1.9-2.3 11.3-2.3 13.2 0-1.9 2.1-4.1 3.3-6.6 3.3s-4.7-1.2-6.6-3.3Z" fill="#f07c7c"/>
