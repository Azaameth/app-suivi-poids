        fill="#fff" stroke="#1d1b20" stroke-width="3.6" stroke-linejoin="round"/>
  <!-- lunettes -->
  <g fill="#fff" stroke="#3b2716" stroke-width="3.4" stroke-linejoin="round">
    <rect x="11.5" y="17" width="17.5" height="14" rx="4.5"/>
    <rect x="35" y="17" width="17.5" height="14" rx="4.5"/>
  </g>
  <path d="M29 22.5c2-1.6 4-1.6 6 0" fill="none" stroke="#3b2716" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M12 18.6h16.5M35.5 18.6h16.5" stroke="#3b2716" stroke-width="3.2" stroke-linecap="round"/>
